[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steinwalte-realtimedw_jd162"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "steinwalte" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://steinwalte.github.io"
Repository = "https://github.com/steinwalte/realtimedw_jd162"
Issues = "https://github.com/steinwalte/realtimedw_jd162/issues"

[project.scripts]
realtimedw_jd162 = "realtimedw_jd162:main"

[tool.setuptools]
py-modules = ["realtimedw_jd162"]
